[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apigen_copier"
version = "0.3.3-dev15"
description = "Python API Generator using Copier"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "CloudAppi" }
]
dependencies = [
    "copier~=9.11.0",
    "pyyaml~=6.0.2",
    "jinja2~=3.1.6",
    "pydantic~=2.10.0"
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "httpx==0.28.1",
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "sqlalchemy==2.0.45",
    "pydantic-settings==2.12.0",
    "aiosqlite==0.22.1",
    "greenlet==3.3.0",
    "pytest-cov==7.0.0",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
norecursedirs = ["docs"]

[project.scripts]
apigen-copier = "apigen_copier.core:generate_project"

[tool.hatch.build.targets.wheel]
packages = ["src/apigen_copier"]
