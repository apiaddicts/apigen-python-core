openapi: 3.0.0
info:
  title: Test CRUD API
  description: Simple API to test CRUD operations with generated code
  version: 1.0.0

x-apigen-project:
  name: Test App
  description: Test Application for CRUD
  version: 1.0.0
  data-driver: sqlite # Using sqlite for easy local testing

components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: integer
      required:
        - name
        - price

  x-apigen-models:
    Item:
      relational-persistence:
        table: items
      attributes:
        - name: id
          type: Integer
          relational-persistence:
            primary-key: true
            autogenerated: true
        - name: name
          type: String
          relational-persistence: {}
        - name: price
          type: Integer
          relational-persistence:
            column: "cost"

paths:
  /items:
    x-apigen-binding:
      model: Item
    get:
      operationId: getItems
      summary: Get all items
      responses:
        "200":
          description: List of items
    post:
      operationId: createItem
      summary: Create an item
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: Item created

  /items/{id}:
    x-apigen-binding:
      model: Item
    get:
      operationId: getItem
      summary: Get item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item found
    delete:
      operationId: deleteItem
      summary: Delete item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item deleted
